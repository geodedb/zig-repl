---
# GitLab CI/CD Pipeline for repl
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    - company
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"
  # Digest-pinned base image (GAP-0071 / #133). Pinning to the immutable
  # multi-arch OCI index digest instead of the floating `bookworm-slim`
  # tag makes CI builds reproducible and tamper-evident. Resolved via
  # `docker manifest inspect debian:bookworm-slim` (OCI image index,
  # 15 platform manifests) on 2026-06-12. Update alongside any base-image
  # refresh.
  DEBIAN_IMAGE: "debian:bookworm-slim@sha256:96e378d7e6531ac9a15ad505478fcc2e69f371b10f5cdf87857c4b8188404716"
  # Pinned SHA-256 hashes for Zig binary tarballs (SF-020: independent trust root).
  # These are verified from the git repository, not fetched from the download origin.
  # When updating ZIG_VERSION, update these hashes from https://ziglang.org/download/
  ZIG_SHA256_X86_64_LINUX: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  ZIG_SHA256_AARCH64_LINUX: "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17"

# Cache the Zig installation directory across jobs to avoid re-downloading
# the ~45 MB tarball on every job. The existing guard in .install-zig
# (`if [ ! -f "zig-${ZIG_VERSION}/zig" ]`) skips the download when cached.
cache:
  key: "zig-${ZIG_VERSION}"
  paths:
    - "zig-${ZIG_VERSION}/"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SF-020: SHA-256 pinned in repo, not fetched from download origin)
.install-zig: &install-zig
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      # Install download dependencies only when Zig is not cached
      command -v curl >/dev/null 2>&1 && command -v xz >/dev/null 2>&1 || { apt-get update && apt-get install -y curl xz-utils; }
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64"; EXPECTED_HASH="${ZIG_SHA256_X86_64_LINUX}" ;;
        aarch64) ZIG_ARCH="aarch64"; EXPECTED_HASH="${ZIG_SHA256_AARCH64_LINUX}" ;;
        arm64)   ZIG_ARCH="aarch64"; EXPECTED_HASH="${ZIG_SHA256_AARCH64_LINUX}" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      if [ -z "${EXPECTED_HASH}" ]; then
        echo "ERROR: No pinned SHA-256 hash for ${ZIG_ARCH}-linux. Update ZIG_SHA256_* variables."; exit 1
      fi
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  # Zig fetches dependencies over HTTPS and needs the system CA bundle. When the
  # Zig toolchain comes from the cache the download branch above is skipped, so
  # debian:bookworm-slim would have no CA certificates and every dependency fetch
  # fails with TlsInitializationFailed.
  - test -s /etc/ssl/certs/ca-certificates.crt || { apt-get update && apt-get install -y --no-install-recommends ca-certificates; }
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build --summary all

# Unit tests
test:
  stage: test
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - umask 077
    - zig build test --summary all
  needs:
    - build

# Observability seam tests with otel compiled in (#127, #140). Guards
# against the seam silently regressing to a permanent no-op: under
# -Dwith_otel=true the enabled smoke test must actually RUN (record one
# repl.eval span) and the disabled test's `enabled == with_otel`
# invariant must hold. The default `test` job above exercises the
# otel-off path; this job exercises the otel-on path.
test-with-otel:
  stage: test
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Dwith_otel=true --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
fuzz:
  stage: fuzz
  image: $DEBIAN_IMAGE
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

# SONNY-4848: verify the filtered package contains all declared build inputs.
test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
  before_script:
    - *install-zig
    - apt-get update -qq && apt-get install -y --no-install-recommends git python3
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always
